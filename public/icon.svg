<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.5"/>

  <!-- Invoice Sheet Main Container -->
  <g filter="url(#glow)">
    <!-- Main Invoice Card -->
    <path d="M140 100 C140 86.745 150.745 76 164 76 L348 76 C361.255 76 372 86.745 372 100 L372 400 L338 382 L304 400 L270 382 L236 400 L202 382 L168 400 L140 382 Z" fill="#ffffff"/>
    
    <!-- Top accent header on invoice -->
    <path d="M140 100 C140 86.745 150.745 76 164 76 L348 76 C361.255 76 372 86.745 372 100 L372 144 L140 144 Z" fill="url(#accentGrad)"/>
    
    <!-- Header Sparkle / Flow Line -->
    <circle cx="180" cy="110" r="10" fill="#ffffff" fill-opacity="0.9"/>
    <rect x="204" y="104" width="90" height="12" rx="6" fill="#ffffff" fill-opacity="0.9"/>

    <!-- Document Lines -->
    <rect x="176" y="180" width="160" height="14" rx="7" fill="#0f172a"/>
    <rect x="176" y="212" width="110" height="12" rx="6" fill="#94a3b8"/>
    
    <!-- Table Mock items -->
    <rect x="176" y="248" width="160" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="176" y="272" width="160" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="176" y="296" width="160" height="8" rx="4" fill="#e2e8f0"/>
    
    <!-- Total Highlight Badge -->
    <rect x="176" y="328" width="160" height="32" rx="8" fill="#f0f9ff"/>
    <rect x="190" y="338" width="50" height="12" rx="4" fill="#0284c7"/>
    <rect x="270" y="338" width="52" height="12" rx="4" fill="#0369a1"/>
  </g>
  
  <!-- Floating Flow Badge (Currency / Checkmark) -->
  <g transform="translate(324, 300)">
    <circle cx="36" cy="36" r="44" fill="url(#accentGrad)" filter="url(#glow)"/>
    <circle cx="36" cy="36" r="40" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.6"/>
    <!-- Currency / Check icon -->
    <path d="M24 38 L32 46 L50 26" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
